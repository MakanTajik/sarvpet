    <script>
        fetch('posts.json')
            .then(response => response.json())
            .then(posts => {
                const container = document.getElementById('blog-posts-container');
                container.innerHTML = '';
                posts.forEach(post => {
                    container.innerHTML += `
                        <a href="${post.displayData.url}" class="article-card" itemscope itemtype="https://schema.org/BlogPosting">
                            <img src="${post.displayData.image}" alt="${post.displayData.imageAlt}" class="article-img" itemprop="image">
                            <div class="article-content">
                                <div class="article-meta">
                                    <span itemprop="datePublished"><i class="fa-regular fa-calendar"></i> ${post.displayData.date}</span>
                                    <span class="rating-stars" itemprop="aggregateRating" itemscope itemtype="https://schema.org/AggregateRating">
                                        <i class="fa-solid fa-star"></i> <span itemprop="ratingValue">${post.displayData.rating}</span> (${post.displayData.reviewsCount})
                                    </span>
                                </div>
                                <h2 class="article-title" itemprop="headline">${post.displayData.title}</h2>
                                <p class="article-excerpt" itemprop="description">${post.displayData.excerpt}</p>
                            </div>
                        </a>
                    `;
                });
            }).catch(error => console.error('Error loading posts:', error));
    </script>
