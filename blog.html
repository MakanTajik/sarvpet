    <style>
        :root { --primary-green: #1a5d38; --dark-green: #103b24; --light-green: #e3ebe4; --accent-orange: #f38b2b; --bg-cream: #f7f4ed; --text-dark: #2c3e50; --text-muted: #6c757d; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background-color: var(--bg-cream); color: var(--text-dark); padding: 15px; padding-bottom: 110px; display: flex; flex-direction: column; align-items: center; }

        .blog-container { max-width: 580px; width: 100%; }
        .blog-header { text-align: center; margin-bottom: 25px; }
        .blog-header h1 { font-size: 20px; font-weight: 900; color: var(--primary-green); margin-bottom: 5px; }
        .blog-header p { font-size: 12px; color: var(--text-muted); }

        .post-card { background: #fff; border-radius: 20px; padding: 18px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(26, 93, 56, 0.06); border: 2px solid var(--light-green); display: flex; gap: 15px; align-items: center; text-decoration: none; color: inherit; transition: 0.2s; }
        .post-card:hover { transform: translateY(-3px); border-color: var(--primary-green); }

        .post-img { width: 110px; height: 110px; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; flex-shrink: 0; }
        .post-info { flex-grow: 1; }

        .post-meta-top { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
        .post-rating { color: #f59e0b; font-weight: 700; }

        .post-title { font-size: 15px; font-weight: 900; color: var(--primary-green); margin-bottom: 6px; line-height: 1.4; }
        .post-excerpt { font-size: 12px; color: var(--text-muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .sticky-contact-footer { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: calc(100% - 30px); max-width: 524px; background: rgba(16, 59, 36, 0.98); backdrop-filter: blur(16px); padding: 10px 18px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; border-top-left-radius: 20px; border-top-right-radius: 20px; border-top: 1px solid rgba(255,255,255,0.2); }
        .sticky-phone { color: #fff; font-size: 18px; font-weight: 800; text-decoration: none; direction: ltr; font-family: 'Vazirmatn', sans-serif !important; }
        .sticky-wa-btn { background: #25d366; color: #fff; padding: 7px 12px; border-radius: 10px; font-size: 11px; font-weight: 700; text-decoration: none; }
        .main-footer { margin-top: 20px; font-size: 11px; color: var(--text-muted); text-align: center; }
    </style>
</head>
<body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MPCWFPT3" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <div class="blog-container">
        <div class="blog-header">
            <h1>سروپت بلاگ</h1>
            <p>راهنمای تخصصی تغذیه، نگهداری و بازار حیوانات خانگی</p>
        </div>

        <div id="posts-list">
            <p style="text-align:center; color: var(--text-muted); padding: 20px;">در حال بارگذاری مقالات...</p>
        </div>
    </div>

    <div class="sticky-contact-footer">
        <a href="tel:+989124766705" class="sticky-phone"><i class="fa-solid fa-phone-volume" style="color:var(--accent-orange);"></i> 0912 47 66 705</a>
        <a href="https://wa.me/989124766705?text=%D8%B3%D9%84%D8%A7%D9%85%D8%8C+%D9%88%D9%82%D8%AA+%D8%A8%D8%AE%DB%8C%DB%8C%D8%B1+%D8%A7%D8%20%D8%B7%D8%B1%DB%8C%D9%20%D8%B3%D8%A7%DB%8C%D8%AA%D8%AA%D9%88%D9%86+%D9%BE%DB%8C%D8%A7%D9%85+%D9%85%DB%8C%E2%80%8C%D8%AF%D9%85.+%D9%85%D9%85%D9%86%D9%86+%D9%85%DB%8C%E2%80%8C%D8%B4%D9%88%D9%85+%D9%84%DB%8C%D8%3B%D8%A7%D8%B+%D9%88+%D9%82%DB%8C%D9%85%D8%AA%D9%87%D8%A7%D8%B4%D9%88%D9%86+%D8%B1%D9%88+%D8%A8%D8%B1%D8%A7%D9%85+%D8%A7%D8%B1%D8%B7%D8%A7%D9%84+%D8%A7%D8%B1%D8%B7%D8%A7%D8%B4+%D8%A7%D8%B9%DB%8C%D8%AF." class="sticky-wa-btn"><i class="fa-brands fa-whatsapp"></i> ثبت سفارش</a>
    </div>

    <footer class="main-footer">تمامی حقوق محفوظ است © ۱۴۰۵ - مجموعه سروپت (SarvPet)</footer>

    <script>
        const SUPABASE_URL = 'https://hvynddpsueccjpvpktin.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2eW5kZHBzdWVjY2pwdnBrdGluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NTIzNTEsImV4cCI6MjEwODMyODM1MX0.lpUlNkWCRabdKoJGXcbCgoNEHjfjz_GZE9uSR99rp94';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        fetch('posts.json')
            .then(response => response.json())
            .then(async posts => {
                const container = document.getElementById('posts-list');
                container.innerHTML = '';

                for (const post of posts) {
                    const postId = post.id;

                    let { data } = await _supabase
                        .from('article_ratings')
                        .select('*')
                        .eq('article_id', postId)
                        .single();

                    let votesCount = data ? data.votes_count : 0;
                    let totalScore = data ? data.total_score : 0;

                    let ratingText = "";
                    if (votesCount > 0) {
                        let avg = (totalScore / votesCount).toFixed(1);
                        ratingText = `${avg} / ۵ (${votesCount} رای)`;
                    } else {
                        ratingText = "رای داده نشده";
                    }

                    const card = document.createElement('a');
                    card.href = `article.html?id=${postId}`;
                    card.className = 'post-card';
                    card.innerHTML = `
                        <img src="${post.displayData.image}" alt="${post.displayData.imageAlt || ''}" class="post-img">
                        <div class="post-info">
                            <div class="post-meta-top">
                                <span><i class="fa-regular fa-calendar"></i> ${post.displayData.date || ''}</span>
                                <span class="post-rating"><i class="fa-solid fa-star"></i> ${ratingText}</span>
                            </div>
                            <h2 class="post-title">${post.displayData.title}</h2>
                            <p class="post-excerpt">${post.displayData.excerpt || ''}</p>
                        </div>
                    `;
                    container.appendChild(card);
                }
            })
            .catch(error => {
                console.error('Error loading posts:', error);
                document.getElementById('posts-list').innerHTML = '<p style="text-align:center; color:red;">خطا در بارگذاری مقالات.</p>';
            });
    </script>
</body>
</html>
