<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه مورد نظر پیدا نشد (404) | سروپت (SarvPet)</title>
    <meta name="robots" content="noindex, follow">

    <!-- فاوآیکون -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary-green: #1a5d38; --dark-green: #103b24; --light-green: #e3ebe4; --accent-orange: #f38b2b; --bg-cream: #f7f4ed; --text-dark: #2c3e50; --text-muted: #6c757d; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background-color: var(--bg-cream); color: var(--text-dark); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }

        .error-card { background: #fff; max-width: 480px; width: 100%; padding: 35px 25px; border-radius: 28px; box-shadow: 0 15px 35px rgba(26, 93, 56, 0.1); border: 2px solid var(--light-green); text-align: center; }
        .error-code { font-size: 72px; font-weight: 900; color: var(--accent-orange); line-height: 1; margin-bottom: 10px; }
        .error-title { font-size: 18px; font-weight: 800; color: var(--primary-green); margin-bottom: 15px; }
        .error-desc { font-size: 13px; color: #555; line-height: 2; margin-bottom: 25px; }
        .btn-container { display: flex; flex-direction: column; gap: 10px; }
        .nav-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 14px; font-size: 13px; font-weight: 700; text-decoration: none; }
        .btn-primary-custom { background: var(--primary-green); color: #fff; }
        .btn-secondary-custom { background: var(--light-green); color: var(--primary-green); }
        .main-footer { margin-top: 25px; font-size: 11px; color: var(--text-muted); text-align: center; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">404</div>
        <h1 class="error-title">خطای عدم دسترسی</h1>
        <p class="error-desc">این صفحه وجود ندارد. می‌تونم پیشنهاد کنم که به یکی از دو صفحه زیر بروید:</p>
        <div class="btn-container">
            <a href="https://www.sarvpet.com/blog.html" class="nav-btn btn-secondary-custom"><i class="fa-solid fa-newspaper"></i> صفحه مقالات</a>
            <a href="https://www.sarvpet.com/index.html" class="nav-btn btn-primary-custom"><i class="fa-solid fa-house"></i> صفحه اصلی</a>
        </div>
    </div>
    <footer class="main-footer">تمامی حقوق محفوظ است © ۱۴۰۵ - مجموعه سروپت (SarvPet)</footer>
</body>
</html>
