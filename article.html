    <script>
        const SUPABASE_URL = 'https://hvynddpsueccjpvpktin.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2eW5kZHBzdWVjY2pwdnBrdGluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NTIzNTEsImV4cCI6MjEwODMyODM1MX0.lpUlNkWCRabdKoJGXcbCgoNEHjfjz_GZE9uSR99rp94';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        fetch('posts.json')
            .then(response => response.json())
            .then(posts => {
                const post = posts.find(p => p.id === articleId) || posts[0];

                document.getElementById('page-title').innerText = post.seo.metaTitle;
                document.getElementById('meta-desc').setAttribute('content', post.seo.metaDescription);
                document.getElementById('article-title').innerText = post.displayData.title;
                document.getElementById('article-date').innerText = post.displayData.date;

                const imgEl = document.getElementById('article-img');
                imgEl.src = post.displayData.image;
                imgEl.alt = post.displayData.imageAlt;
                document.getElementById('article-body').innerHTML = post.content;

                initGlobalRating(post.id);

                const scriptTag = document.createElement('script');
                scriptTag.type = 'application/ld+json';
                scriptTag.text = JSON.stringify(post.schemaOrg);
                document.head.appendChild(scriptTag);
            }).catch(error => console.error('Error loading article:', error));

        function setCookie(name, value, days) {
            let expires = "";
            if (days) {
                let date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/";
        }

        function getCookie(name) {
            let nameEQ = name + "=";
            let ca = document.cookie.split(';');
            for(let i=0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0)==' ') c = c.substring(1,p=c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length,c.length);
            }
            return null;
        }

        async function initGlobalRating(postId) {
            const container = document.getElementById('rating-container');
            if (!container) return;

            const hasVotedCookie = getCookie(`voted_${postId}`);

            let { data, error } = await _supabase
                .from('article_ratings')
                .select('*')
                .eq('article_id', postId)
                .single();

            let votesCount = data ? data.votes_count : 0;
            let totalScore = data ? data.total_score : 0;

            if (votesCount === 0) {
                container.innerHTML = `
                    <i class="fa-solid fa-star"></i> امتیاز: <span itemprop="ratingValue">رای داده نشده</span>
                    <div class="interactive-rating-stars" id="star-box">
                        <span class="star-item" data-value="5">★</span>
                        <span class="star-item" data-value="4">★</span>
                        <span class="star-item" data-value="3">★</span>
                        <span class="star-item" data-value="2">★</span>
                        <span class="star-item" data-value="1">★</span>
                    </div>
                `;
            } else if (hasVotedCookie) {
                let average = (totalScore / votesCount).toFixed(1);
                container.innerHTML = `
                    <i class="fa-solid fa-star"></i> امتیاز: <span itemprop="ratingValue">${average}</span> / ۵
                    <span style="font-size: 11px; color: var(--text-muted); font-weight: normal;">(${votesCount} رای - رای شما ثبت شده)</span>
                `;
                return;
            } else {
                let average = (totalScore / votesCount).toFixed(1);
                container.innerHTML = `
                    <i class="fa-solid fa-star"></i> امتیاز: <span itemprop="ratingValue">${average} / ۵ (${votesCount} رای)</span>
                    <span style="font-size: 11px; font-weight: normal; margin-right: 4px;">رای دهید:</span>
                    <div class="interactive-rating-stars" id="star-box">
                        <span class="star-item" data-value="5">★</span>
                        <span class="star-item" data-value="4">★</span>
                        <span class="star-item" data-value="3">★</span>
                        <span class="star-item" data-value="2">★</span>
                        <span class="star-item" data-value="1">★</span>
                    </div>
                `;
            }

            const stars = container.querySelectorAll('.star-item');
            stars.forEach(star => {
                star.addEventListener('click', async function () {
                    const score = parseInt(this.getAttribute('data-value'));

                    setCookie(`voted_${postId}`, score, 365);

                    let newVotesCount = votesCount + 1;
                    let newTotalScore = totalScore + score;
                    let newAverage = (newTotalScore / newVotesCount).toFixed(1);

                    if (!data) {
                        await _supabase.from('article_ratings').insert([
                            { article_id: postId, total_score: score, votes_count: 1 }
                        ]);
                    } else {
                        await _supabase.from('article_ratings').update({
                            total_score: newTotalScore,
                            votes_count: newVotesCount
                        }).eq('article_id', postId);
                    }

                    container.innerHTML = `
                        <i class="fa-solid fa-check" style="color:var(--primary-green);"></i>
                        <span style="font-size: 11px; font-weight: bold; color: var(--primary-green);">با تشکر! رای شما ثبت شد.</span>
                        <span style="font-size: 11px; color: var(--text-muted);">میانگین: ${newAverage} (${newVotesCount} رای)</span>
                    `;
                });
            });
        }
    </script>
