<body>

    <div itemscope itemtype="https://schema.org/BlogPosting">
        <div>
            <a href="blog.html"><i>←</i> بازگشت به مقالات</a>
            <div>
                <img alt="سروپت" src="Logo-7format-01.png">
                <span>سروپت بلاگ</span>
            </div>
        </div>

        <img id="article-img" alt="" itemprop="image" src="" style="display:none;">
        <h1 id="article-title" itemprop="headline">در حال بارگذاری مقاله...</h1>

        <div>
            <span itemprop=datePublished><i>📅</i> <span id="article-date">---</span></span>

            <!-- بخش نمایش و ثبت امتیاز واقعی -->
            <span id="rating-container" itemprop="aggregateRating" itemscope itemtype="https://schema.org/AggregateRating">
                <!-- با جاوااسکریپت پر می‌شود -->
            </span>
        </div>

        <div id="article-body" itemprop="articleBody">
            <p>لطفاً چند لحظه شکیبا باشید...</p>
        </div>

        <div>
            <p>جهت ثبت سفارش عمده محصولات و دریافت کاتالوگ تماس بگیرید:</p>
            <a href="tel:09124766705">0912 47 66 705</a>
            <a href="https://wa.me/989124766705?text=%D8%B3%D9%84%D8%A7%D9%85%D8%8C%20%D9%88%D9%82%D8%AA%20%D8%A8%D8%AE%DB%8C%D8%B1%20%D8%AC%D9%87%D8%AA%20%D8%AF%D8%B1%DB%8C%D8%A7%D9%81%D8%AA%20%D9%84%DB%8C%D8%B3%D8%AA%20%D9%85%D%85%D8%AD%D8%B5%D9%88%D9%84%D8%A7%D8%AA%20%D9%88%20%DA%A9%D8%B3%D8%A8+%D8%A7%D8%B0%D9%84%D8%A7%D8%B9%D8%A7%D8%AA+%D8%A8%DB%8C%D8%B4%D8%AA%D8%B1+%D9%BE%DB%8C%D8%A7%D9%85+%D9%85%DB%8C%E2%80%8C%D8%AF%D9%85."><i>💬</i> ثبت سفارش در واتساپ</a>
        </div>
    </div>

    <footer>تمامی حقوق محفوظ است © ۱۴۰۵ - مجموعه سروپت (SarvPet)</footer>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');

            if (!postId) {
                showError("مقاله مورد نظر یافت نشد.");
                return;
            }

            fetch('posts.json')
                .then(response => {
                    if (!response.ok) throw new Error("خطا در لود اطلاعات مقالات");
                    return response.json();
                })
                .then(posts => {
                    const post = posts.find(p => p.id === postId || p.slug === postId);
                    if (!post) {
                        showError("مقاله مورد نظر پیدا نشد.");
                        return;
                    }

                    renderArticle(post);
                })
                .catch(error => {
                    console.error(error);
                    showError("خطا در دریافت اطلاعات مقاله.");
                });
        });

        function renderArticle(post) {
            document.title = (post.seo && post.seo.metaTitle) ? post.seo.metaTitle : post.displayData.title;
            document.getElementById('article-title').innerText = post.displayData.title || post.schemaOrg?.headline;
            document.getElementById('article-date').innerText = post.displayData.date || "۱۴۰۵";

            const imgElement = document.getElementById('article-img');
            const imgSrc = post.displayData.image || (post.schemaOrg && post.schemaOrg["@graph"] ? post.schemaOrg["@graph"][0]?.image : null);
            if (imgSrc) {
                imgElement.src = imgSrc;
                imgElement.alt = post.displayData.imageAlt || post.displayData.title;
                imgElement.style.display = 'block';
            }

            document.getElementById('article-body').innerHTML = post.content || "<p>محتوایی برای این مقاله ثبت نشده است.</p>";

            if (post.schemaOrg) {
                const scriptSchema = document.createElement('script');
                scriptSchema.type = 'application/ld+json';
                scriptSchema.text = JSON.stringify(post.schemaOrg);
                document.head.appendChild(scriptSchema);
            }

            initRatingSystem(post);
        }

        function initRatingSystem(post) {
            const container = document.getElementById('rating-container');
            if (!container) return;

            const postId = post.id;
            const userVotedScore = localStorage.getItem(`voted_${postId}`);

            // جلوگیری از نمایش null و تعیین مقادیر عددی پاک‌سازی شده
            let baseRating = parseFloat(post.displayData?.rating);
            let currentRating = !isNaN(baseRating) ? baseRating : 0;
            let reviewsCount = parseInt(post.displayData?.reviewsCount) || 0;

            // بررسی رای‌های ذخیره شده محلی اضافی برای این مقاله (اگر کاربران مختلف روی این مرورگر رای داده باشند یا شبیه‌سازی)
            let extraScoreSum = parseInt(localStorage.getItem(`sum_${postId}`)) || 0;
            let extraCount = parseInt(localStorage.getItem(`cnt_${postId}`)) || 0;

            let totalReviews = reviewsCount + extraCount;
            let totalScoreValue = (currentRating * reviewsCount) + extraScoreSum;
            let finalAvg = totalReviews > 0 ? (totalScoreValue / totalReviews).toFixed(1) : "۰";

            if (userVotedScore) {
                // اگر خود این کاربر قبلاً رای داده است
                container.innerHTML = `
                    <i>★</i> امتیاز: <span itemprop="ratingValue">${finalAvg}</span> / ۵
                    <span style="font-size: 0.85rem; color: #666;">(${totalReviews} رای - رای شما ثبت شد)</span>
                `;
            } else {
                // اگر کاربر هنوز رای نداده است، هم میانگین کل را می‌بیند و هم می‌تواند رای دهد
                let ratingDisplay = totalReviews > 0 ? `${finalAvg} / ۵ (${totalReviews} رای)` : `هنوز امتیازی ثبت نشده`;

                container.innerHTML = `
                    <i>★</i> امتیاز: <span itemprop="ratingValue">${ratingDisplay}</span>
                    <div class="interactive-stars" style="display: inline-block; margin-right: 10px; cursor: pointer;">
                        <span class="star" data-value="5" style="color:#ccc; font-size:1.2rem;">★</span>
                        <span class="star" data-value="4" style="color:#ccc; font-size:1.2rem;">★</span>
                        <span class="star" data-value="3" style="color:#ccc; font-size:1.2rem;">★</span>
                        <span class="star" data-value="2" style="color:#ccc; font-size:1.2rem;">★</span>
                        <span class="star" data-value="1" style="color:#ccc; font-size:1.2rem;">★</span>
                    </div>
                `;

                const stars = container.querySelectorAll('.star');
                stars.forEach(star => {
                    star.addEventListener('click', function () {
                        const score = parseInt(this.getAttribute('data-value'));

                        // ثبت وضعیت رای دادن کاربر
                        localStorage.setItem(`voted_${postId}`, score);

                        // ذخیره در مجموع رای‌های محلی برای نمایش صحیح تعداد و میانگین جدید
                        localStorage.setItem(`sum_${postId}`, extraScoreSum + score);
                        localStorage.setItem(`cnt_${postId}`, extraCount + 1);

                        let newTotalReviews = totalReviews + 1;
                        let newFinalAvg = ((totalScoreValue + score) / newTotalReviews).toFixed(1);

                        container.innerHTML = `
                            <i>✓</i> با تشکر! رای شما ثبت شد. امتیاز جدید: <strong>${newFinalAvg}</strong> / ۵ (${newTotalReviews} رای)
                        `;
                    });
                });
            }
        }

        function showError(msg) {
            document.getElementById('article-title').innerText = "خطا";
            document.getElementById('article-body').innerHTML = `<p style="color:red; text-align:center;">${msg}</p>`;
        }
    </script>
</body>
